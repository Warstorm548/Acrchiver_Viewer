<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenCloud Archive Viewer</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div id="app-content"></div>
    
    <script src="dist/app.js"></script>
    <script>
        // Mock OpenCloud context for standalone testing
        const mockContext = {
            fileId: 'test-archive-1',
            fileName: 'test-archive.zip',
            fileUrl: '/path/to/test-archive.zip',
            
            async getFileInfo(fileId) {
                return {
                    id: fileId,
                    name: 'test-archive.zip',
                    size: 1024 * 1024 * 50, // 50MB
                    mimeType: 'application/zip'
                };
            },
            
            getAuthToken() {
                return 'mock-token-123';
            },
            
            async saveFile(fileId, data) {
                console.log('Mock: Saving file', fileId, data.length, 'bytes');
                return true;
            },
            
            async uploadFile(name, data) {
                console.log('Mock: Uploading file', name, data.length, 'bytes');
                return 'new-file-id-' + Date.now();
            },
            
            async createShare(fileId) {
                console.log('Mock: Creating share for', fileId);
                return 'https://example.com/share/' + fileId;
            }
        };
        
        // Initialize app with mock context
        if (typeof ArchiveViewer !== 'undefined') {
            const app = new ArchiveViewer();
            app.init(mockContext);
        }
    </script>
</body>
</html>
