version: '3.8'

services:
  archive-viewer:
    build: .
    image: opencloud/web-app-archive-viewer:1.0.0
    container_name: archive-viewer
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - archive-viewer-data:/usr/share/nginx/html/archive-viewer
    networks:
      - opencloud-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.opencloud.app=archive-viewer"
      - "com.opencloud.version=1.0.0"

volumes:
  archive-viewer-data:
    driver: local

networks:
  opencloud-net:
    external: true
