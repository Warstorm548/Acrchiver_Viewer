# Archive Viewer: copy of opencloud-compose's config/opencloud/proxy.yaml plus the two
# /archive-api routes for the archive helper (marked below). Mounted over the upstream file by
# archive-helper.yml. After each opencloud-compose update, diff the upstream file against this one
# and copy over any upstream change.
# This adds additional routes to the proxy. Forwarding
# request on '/carddav/', '/caldav/' and the respective '/.well-knwown'
# endpoints to the radicale container and setting the required headers.
# '/yjs' is forwarded to the yjs container.
additional_policies:
  - name: default
    routes:
      # --- Archive Viewer helper (start) ---
      # Downloads use single-use tickets checked by the helper itself, so a plain browser download
      # (which can't send a login token) works. Must come before /archive-api/ (first match wins).
      - endpoint: /archive-api/download/
        backend: http://archive-helper:8080
        unprotected: true
        skip_x_access_token: true
      # Login required. The proxy sets X-Remote-User to the user's ID, replacing any value the
      # client sent; the helper never receives OpenCloud's internal token.
      - endpoint: /archive-api/
        backend: http://archive-helper:8080
        remote_user_header: X-Remote-User
        skip_x_access_token: true
      # --- Archive Viewer helper (end) ---
      - endpoint: /yjs
        backend: http://yjs:1234
        unprotected: true
      - endpoint: /caldav/
        backend: http://radicale:5232
        remote_user_header: X-Remote-User
        skip_x_access_token: true
        additional_headers:
          - X-Script-Name: /caldav
      - endpoint: /.well-known/caldav
        backend: http://radicale:5232
        remote_user_header: X-Remote-User
        skip_x_access_token: true
        additional_headers:
          - X-Script-Name: /caldav
      - endpoint: /carddav/
        backend: http://radicale:5232
        remote_user_header: X-Remote-User
        skip_x_access_token: true
        additional_headers:
          - X-Script-Name: /carddav
      - endpoint: /.well-known/carddav
        backend: http://radicale:5232
        remote_user_header: X-Remote-User
        skip_x_access_token: true
        additional_headers:
          - X-Script-Name: /carddav
# To enable the radicale web UI add this rule.
# "unprotected" is True because the Web UI itself ask for
# the password.
# Also set "type" to "internal" in the config/radicale/config
