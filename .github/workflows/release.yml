# Release: on a version tag (v0.4.0), checks that the tag matches package.json and the helper's
# api.Version, runs the Go and viewer checks, publishes the helper image to GitHub's container
# registry (linux/amd64 + linux/arm64) and creates the GitHub release with the extension zip and
# the helper's deploy files. See docs/deployment/deploying-to-opencloud.md ("Releasing").
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

env:
  IMAGE: ghcr.io/warstorm548/archive-helper

jobs:
  check:
    name: Check and package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag, package.json and helper version agree
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          package=$(node -p "require('./package.json').version")
          helper=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' server/internal/api/api.go)
          echo "tag $tag, package.json $package, api.Version $helper"
          if [ "$tag" != "$package" ] || [ "$tag" != "$helper" ]; then
            echo "::error::versions differ"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Helper tests
        working-directory: server
        run: |
          go vet ./...
          go test -race ./...

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:types
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:unit --run
      - run: pnpm build
      - run: pnpm package

      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: release/
          if-no-files-found: error

  image:
    name: Helper image
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.check.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub release
    needs: [check, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: extension
          path: release
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # this version's CHANGELOG entry, without its heading
          awk -v head="## [$VERSION]" 'index($0, head) == 1 { found = 1; next }
            found && /^## \[/ { exit } found' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::no CHANGELOG entry for $VERSION"; exit 1; }
          printf '\n## Install\n\nExtension: unzip `archive-viewer-%s.zip` into OpenCloud'"'"'s apps folder and restart OpenCloud.\nHelper image: `docker pull %s:%s` (linux/amd64, linux/arm64); compose files attached below.\nSee [deployment](https://github.com/%s/blob/v%s/docs/deployment/archive-helper.md).\n' \
            "$VERSION" "$IMAGE" "$VERSION" "$GITHUB_REPOSITORY" "$VERSION" >> notes.md
          cp deploy/env.example release/archive-helper.env.example
          gh release create "$GITHUB_REF_NAME" --title "Archive Viewer $VERSION" --notes-file notes.md \
            "release/archive-viewer-$VERSION.zip" "release/archive-viewer-$VERSION.zip.sha256" \
            deploy/compose/archive-helper.yml deploy/compose/proxy.yaml release/archive-helper.env.example
