# Viewer release: on a version tag (v0.5.0), checks that the tag matches package.json, runs the
# viewer and Go checks and creates the GitHub release with the extension zip. The helper has its
# own version and workflow (release-helper.yml, tags helper-v*). See
# docs/deployment/deploying-to-opencloud.md ("Releasing").
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  check:
    name: Check and package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag and package.json agree
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          package=$(node -p "require('./package.json').version")
          echo "tag $tag, package.json $package"
          if [ "$tag" != "$package" ]; then
            echo "::error::versions differ"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Helper tests
        working-directory: server
        run: |
          go vet ./...
          go test -race ./...

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:types
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:unit --run
      - run: pnpm build
      - run: pnpm package

      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: release/
          if-no-files-found: error

  release:
    name: GitHub release
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: extension
          path: release
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # this version's changelog entry, without its heading
          awk -v head="## [$VERSION]" 'index($0, head) == 1 { found = 1; next }
            found && /^## \[/ { exit } found' ArchiveViewerChangelog.md > notes.md
          test -s notes.md || { echo "::error::no ArchiveViewerChangelog.md entry for $VERSION"; exit 1; }
          printf '\n## Install\n\nUnzip `ArchiveViewer-%s.zip` into OpenCloud'"'"'s apps folder and restart OpenCloud.\nThe optional server helper is released separately (`helper-v*` releases); see the compatibility table in [ArchiveViewerChangelog.md](https://github.com/%s/blob/v%s/ArchiveViewerChangelog.md).\n' \
            "$VERSION" "$GITHUB_REPOSITORY" "$VERSION" >> notes.md
          gh release create "$GITHUB_REF_NAME" --title "Archive Viewer $VERSION" --notes-file notes.md \
            "release/ArchiveViewer-$VERSION.zip" "release/ArchiveViewer-$VERSION.zip.sha256"
