# Security overrides for transitive devDependencies flagged by Dependabot / pnpm audit.
# The @opencloud-eu/* packages stay on ~8.2.2 (the web UI bundled with OpenCloud 9.1.0), so their
# vulnerable sub-dependencies are lifted here instead. Remove an entry once the parent package
# ships the fixed version itself. See docs/tech-stack/dependencies.md.
overrides:
  # @module-federation/dts-plugin (via @opencloud-eu/extension-sdk) pins axios 1.13.x
  'axios@<1.20.0': ^1.20.0
  # @module-federation/dts-plugin pins adm-zip 0.5.x
  'adm-zip@<0.6.1': ^0.6.1
  # @module-federation/dts-plugin and isomorphic-ws pin ws 8.18.0
  'ws@>=8.0.0 <8.21.0': ^8.21.0
  # used by both axios versions
  'follow-redirects@<1.16.2': ^1.16.2
  # webdav (via @opencloud-eu/web-client) uses 9.x, eslint uses 10.x
  'minimatch@<11.0.1': ^11.0.1
  # @opencloud-eu/web-client 8.2.2 and webdav use 5.11.x (quadratic CPU when scanning)
  'fast-xml-parser@<5.12.0': ^5.12.0
  # js-beautify (via @vue/test-utils) and vue3-gettext use 13.x (AbortSignal bypass)
  'glob@>=9.0.0 <14.0.2': ^14.0.2
