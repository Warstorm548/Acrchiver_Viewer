# Security overrides for transitive devDependencies flagged by Dependabot.
# The @opencloud-eu/* packages stay on ~8.0.0 (pinned to the OpenCloud 8.0 server), so their
# vulnerable sub-dependencies are lifted here instead. Remove an entry once the parent package
# ships the fixed version itself. See docs/tech-stack/dependencies.md.
overrides:
  # @module-federation/dts-plugin (via @opencloud-eu/extension-sdk) pins axios 1.13.x
  'axios@<1.20.0': ^1.20.0
  # @module-federation/dts-plugin pins adm-zip 0.5.x
  'adm-zip@<0.6.1': ^0.6.1
  # @module-federation/dts-plugin and isomorphic-ws pin ws 8.18.0
  'ws@>=8.0.0 <8.21.0': ^8.21.0
  # used by both axios versions
  'follow-redirects@<1.16.2': ^1.16.2
  # webdav (via @opencloud-eu/web-client) uses 9.x, eslint uses 10.x
  'minimatch@<11.0.1': ^11.0.1
